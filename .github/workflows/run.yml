name: Build FreeBSD amd64 TUN

on:
  push:
    branches: [master, 'codex/**']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: freebsd-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upstream:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - name: Check latest upstream stable release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-upstream.sh

  build:
    needs: upstream
    outputs:
      migrated: ${{ steps.prepare.outputs.migrated }}
    if: needs.upstream.outputs.build == 'true'
    env:
      MIHOMO_VERSION: ${{ needs.upstream.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Test deterministic patch migration
        run: python3 scripts/test-migrate-patch.py
      - name: Prepare sources and migrate FreeBSD TUN patches if needed
        id: prepare
        run: scripts/prepare.sh
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: freebsd-amd64-${{ runner.os }}-${{ hashFiles('.go-version', 'build.env', 'patches/**', '.build/mihomo/go.sum') }}
      - name: Build FreeBSD x86-64 binary
        run: scripts/build.sh
      - name: Verify target and archive
        run: |
          file dist/clash-meta-freebsd-amd64 | tee dist/file.txt
          grep -q 'ELF 64-bit.*x86-64.*FreeBSD' dist/file.txt
          xz --test dist/clash-meta-freebsd-amd64.xz
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-freebsd-amd64-tun
          path: |
            dist/clash-meta-freebsd-amd64.xz
            dist/SHA256SUMS
            dist/build-info.txt
          if-no-files-found: error

      - name: Save migrated patch candidates
        if: steps.prepare.outputs.migrated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tun-patch-update
          include-hidden-files: true
          path: .build/patch-update/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: mihomo-freebsd-amd64-tun
          path: dist
      - name: Test real TUN IPv4/IPv6 TCP/UDP forwarding on FreeBSD amd64
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          arch: amd64
          prepare: command -v python3 >/dev/null 2>&1 || pkg install -y python3
          run: |
            if sh scripts/smoke-freebsd.sh; then
              echo 0 > dist/network/test-exit-status
            else
              echo 1 > dist/network/test-exit-status
            fi
      - name: Require successful TUN forwarding tests
        run: test "$(cat dist/network/test-exit-status)" = 0

      - name: Save TUN traffic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tun-network-tests
          path: |
            dist/network/
            dist/smoke-*.log
          if-no-files-found: warn

  release:
    needs: [upstream, build, smoke]
    env:
      MIHOMO_VERSION: ${{ needs.upstream.outputs.version }}
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: mihomo-freebsd-amd64-tun
          path: dist
      - name: Download tested patch migration
        if: needs.build.outputs.migrated == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tun-patch-update
          path: .build/patch-update
      - name: Save patches only after compilation and FreeBSD tests pass
        if: needs.build.outputs.migrated == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED_SHA" || {
            echo 'Master changed during testing; retry against the new source.' >&2
            exit 1
          }
          cp .build/patch-update/patches/*.patch patches/
          mv patches/bases .build/previous-patch-bases
          cp -R .build/patch-update/patches/bases patches/bases
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches
          git diff --cached --check
          git commit -m "Migrate FreeBSD TUN patches for upstream ${MIHOMO_VERSION}"
          git push origin HEAD:master
      - name: Read release version
        run: |
          source build.env
          RELEASE_COMMIT=$(git rev-parse HEAD)
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${MIHOMO_VERSION}-freebsd-amd64-${RELEASE_COMMIT::7}" >> "$GITHUB_ENV"
      - name: Publish FreeBSD amd64 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'FreeBSD x86-64 · TUN（system / gvisor / mixed）\n\n上游：MetaCubeX/mihomo v%s\n' "$MIHOMO_VERSION" > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "mihomo ${MIHOMO_VERSION} · FreeBSD x86-64 TUN" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_COMMIT" --title "mihomo ${MIHOMO_VERSION} · FreeBSD x86-64 TUN" --notes-file release-notes.md
          fi
