name: Build FreeBSD amd64 TUN

on:
  push:
    branches: [master, 'codex/**']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: freebsd-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upstream:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - name: Check latest upstream stable release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-upstream.sh

  build:
    needs: upstream
    if: needs.upstream.outputs.build == 'true'
    env:
      MIHOMO_VERSION: ${{ needs.upstream.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Prepare pinned sources and apply FreeBSD TUN patches
        run: scripts/prepare.sh
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: freebsd-amd64-${{ runner.os }}-${{ hashFiles('.go-version', 'build.env', 'patches/**', '.build/mihomo/go.sum') }}
      - name: Build FreeBSD x86-64 binary
        run: scripts/build.sh
      - name: Verify target and archive
        run: |
          file dist/clash-meta-freebsd-amd64 | tee dist/file.txt
          grep -q 'ELF 64-bit.*x86-64.*FreeBSD' dist/file.txt
          xz --test dist/clash-meta-freebsd-amd64.xz
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-freebsd-amd64-tun
          path: |
            dist/clash-meta-freebsd-amd64.xz
            dist/SHA256SUMS
            dist/build-info.txt
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: mihomo-freebsd-amd64-tun
          path: dist
      - name: Start all TUN stacks on FreeBSD amd64
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          arch: amd64
          run: sh scripts/smoke-freebsd.sh

  release:
    needs: [upstream, build, smoke]
    env:
      MIHOMO_VERSION: ${{ needs.upstream.outputs.version }}
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: mihomo-freebsd-amd64-tun
          path: dist
      - name: Read release version
        run: |
          source build.env
          echo "RELEASE_TAG=v${MIHOMO_VERSION}-freebsd-amd64-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Publish FreeBSD amd64 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'FreeBSD x86-64 · TUN（system / gvisor / mixed）\n\n上游：MetaCubeX/mihomo v%s\n' "$MIHOMO_VERSION" > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "mihomo ${MIHOMO_VERSION} · FreeBSD x86-64 TUN" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "mihomo ${MIHOMO_VERSION} · FreeBSD x86-64 TUN" --notes-file release-notes.md
          fi
